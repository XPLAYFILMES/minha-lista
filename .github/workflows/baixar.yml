name: Baixar link e subir pro Release
on:
  workflow_dispatch:
    inputs:
      url_do_video:
        description: 'Link do video (mp4, m3u8, kingplus, etc)'
        required: true
      nome_arquivo:
        description: 'Nome final SEM ESPACO ex: Filme.mp4'
        required: true

permissions:
  contents: write

jobs:
  baixar-e-subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Baixar video (qualquer site)
        run: |
          # tenta com yt-dlp primeiro (funciona pra kingplus, m3u8, etc)
          yt-dlp -o "${{ inputs.nome_arquivo }}" --no-playlist --merge-output-format mp4 "${{ inputs.url_do_video }}" || \
          # se falhar, tenta com curl igual antes
          curl -L -A "Mozilla/5.0" --referer "http://up.if87366.site/" -o "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}"
          ls -lh "${{ inputs.nome_arquivo }}"

      - name: Subir pro Release v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: ${{ inputs.nome_arquivo }}
