name: Baixar link privado e subir pro Release
on:
  workflow_dispatch:
    inputs:
      url_do_video:
        description: 'Link ATIVO do seu servidor privado'
        required: true
      nome_arquivo:
        description: 'Ex: Filme.mp4 SEM ESPACO'
        required: true
      nome_exibicao:
        description: 'Nome na TV'
        required: true
      categoria:
        description: 'Categoria'
        type: choice
        options: [Filmes, Séries, Desenhos, Animes, Ação, Comédia, Terror, Infantil, Outra]
        default: Filmes
      categoria_nova:
        description: 'Se Outra, digite aqui'
        required: false
      genero:
        description: 'Gênero'
        type: choice
        options: [Ação, Aventura, Comédia, Drama, Terror, Ficção, Romance, Suspense, Documentário, Outro]
        default: Ação
      genero_nova:
        description: 'Se Outro, digite aqui'
        required: false
      logo_url:
        description: 'Logo opcional'
        required: false
      referer:
        description: 'Referer do seu servidor - cola o que copiou do DevTools'
        default: 'https://up.if87366.site/'
        required: true

permissions:
  contents: write

jobs:
  baixar-e-subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar do privado
        run: |
          echo "Baixando de: ${{ inputs.url_do_video }}"
          echo "Usando Referer: ${{ inputs.referer }}"
          curl -L -v -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --referer "${{ inputs.referer }}" -H "Origin: ${{ inputs.referer }}" -o "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}" 2>&1 | head -n 100
          ls -lh "${{ inputs.nome_arquivo }}"
          SIZE=$(stat -c%s "${{ inputs.nome_arquivo }}")
          echo "Tamanho: $SIZE"
          if [ $SIZE -lt 1000000 ]; then echo "BLOQUEADO PELO SERVIDOR PRIVADO - Conteudo:"; cat "${{ inputs.nome_arquivo }}"; exit 1; fi

      - name: Subir pro Release v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: ${{ inputs.nome_arquivo }}

      - name: Adicionar na lista
        run: |
          FILE="minha-lista.m3u"
          if [ ! -f "$FILE" ]; then echo "#EXTM3U" > "$FILE"; fi
          CAT="${{ inputs.categoria }}"; if [ "$CAT" = "Outra" ] && [ -n "${{ inputs.categoria_nova }}" ]; then CAT="${{ inputs.categoria_nova }}"; fi
          GEN="${{ inputs.genero }}"; if [ "$GEN" = "Outro" ] && [ -n "${{ inputs.genero_nova }}" ]; then GEN="${{ inputs.genero_nova }}"; fi
          GRUPO="$CAT"; if [ -n "$GEN" ]; then GRUPO="$CAT - $GEN"; fi
          LINK="https://github.com/XPLAYFILMES/minha-lista/releases/download/v1/${{ inputs.nome_arquivo }}"
          echo "" >> "$FILE"
          echo "#EXTINF:-1 tvg-logo=\"${{ inputs.logo_url }}\" group-title=\"$GRUPO\",${{ inputs.nome_exibicao }}" >> "$FILE"
          echo "$LINK" >> "$FILE"

      - name: Salvar lista
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add minha-lista.m3u
          git commit -m "Add ${{ inputs.nome_exibicao }}" || true
          git push
