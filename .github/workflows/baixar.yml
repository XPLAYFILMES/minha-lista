name: Baixar link e subir pro Release
on:
  workflow_dispatch:
    inputs:
      url_do_video:
        description: 'Cole o link do video .mp4'
        required: true
      nome_arquivo:
        description: 'Nome SEM ESPAÇO ex: episodio.mp4'
        required: true

jobs:
  baixar-e-subir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar video
        run: |
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" --referer "http://up.if87366.site/" -o "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}"

      - name: Subir pro Release v1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1
          files: ${{ inputs.nome_arquivo }}
