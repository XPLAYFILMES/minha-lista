name: Baixar link e subir pro Release
on:
  workflow_dispatch:
    inputs:
      url_do_video:
        description: 'Link NOVO .mp4 (pega na hora)'
        required: true
      nome_arquivo:
        description: 'Como vai salvar ex: Filme.mp4 SEM ESPACO'
        required: true
      nome_exibicao:
        description: 'Nome na TV ex: Os Saqueadores (2021)'
        required: true
      categoria:
        description: 'Categoria'
        type: choice
        options: [Filmes, Séries, Desenhos, Animes, Ação, Comédia, Terror, Infantil, Outra]
        default: Filmes
      categoria_nova:
        description: 'Se Outra, digite a nova'
        required: false
      genero:
        description: 'Gênero'
        type: choice
        options: [Ação, Aventura, Comédia, Drama, Terror, Ficção, Romance, Suspense, Documentário, Outro]
        default: Ação
      genero_nova:
        description: 'Se Outro, digite o novo'
        required: false
      logo_url:
        description: 'Link da logo (opcional)'
        required: false

permissions:
  contents: write

jobs:
  baixar-e-subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar ferramentas
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Baixar VIDEO REAL
        run: |
          rm -f "${{ inputs.nome_arquivo }}"
          # tenta 3 formas: yt-dlp, curl com referer, curl puro
          yt-dlp -o "${{ inputs.nome_arquivo }}" --no-playlist --merge-output-format mp4 "${{ inputs.url_do_video }}" || \
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --referer "https://up.if87366.site/" -o "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}" || \
          curl -L -A "Mozilla/5.0" -o "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}"
          
          ls -lh "${{ inputs.nome_arquivo }}"
          SIZE=$(stat -c%s "${{ inputs.nome_arquivo }}")
          echo "Tamanho baixado: $SIZE bytes"
          if [ $SIZE -lt 1000000 ]; then echo "LINK EXPIROU - pega um link novo"; cat "${{ inputs.nome_arquivo }}"; exit 1; fi

      - name: Subir pro Release v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: ${{ inputs.nome_arquivo }}

      - name: Adicionar na lista
        run: |
          FILE="minha-lista.m3u"
          if [ ! -f "$FILE" ]; then echo "#EXTM3U" > "$FILE"; fi
          CAT="${{ inputs.categoria }}"; if [ "$CAT" = "Outra" ] && [ -n "${{ inputs.categoria_nova }}" ]; then CAT="${{ inputs.categoria_nova }}"; fi
          GEN="${{ inputs.genero }}"; if [ "$GEN" = "Outro" ] && [ -n "${{ inputs.genero_nova }}" ]; then GEN="${{ inputs.genero_nova }}"; fi
          GRUPO="$CAT"; if [ -n "$GEN" ]; then GRUPO="$CAT - $GEN"; fi
          LINK="https://github.com/XPLAYFILMES/minha-lista/releases/download/v1/${{ inputs.nome_arquivo }}"
          echo "" >> "$FILE"
          echo "#EXTINF:-1 tvg-logo=\"${{ inputs.logo_url }}\" group-title=\"$GRUPO\",${{ inputs.nome_exibicao }}" >> "$FILE"
          echo "$LINK" >> "$FILE"

      - name: Salvar lista
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add minha-lista.m3u
          git commit -m "Add ${{ inputs.nome_exibicao }}" || true
          git push
