name: Baixar link e subir pro Release
on:
  workflow_dispatch:
    inputs:
      url_do_video:
        description: 'Cole o link do video .mp4'
        required: true
      nome_arquivo:
        description: 'Nome que vai ficar ex: Os.Saqueadores.mp4'
        required: true

jobs:
  baixar-e-subir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar video
        run: wget -O "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}"

      - name: Subir pro Release v1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1
          files: ${{ inputs.nome_arquivo }}
