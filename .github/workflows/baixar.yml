name: Baixar link e subir pro Release
on:
  workflow_dispatch:
    inputs:
      url_do_video:
        description: 'Cole o link do video .mp4'
        required: true
      nome_arquivo:
        description: 'Nome SEM ESPACO ex: episodio.mp4'
        required: true

permissions:
  contents: write

jobs:
  baixar-e-subir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar video
        run: |
          curl -L -A "Mozilla/5.0" --referer "http://up.if87366.site/" -o "${{ inputs.nome_arquivo }}" "${{ inputs.url_do_video }}"

      - name: Subir pro Release v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: ${{ inputs.nome_arquivo }}
